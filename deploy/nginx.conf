# 模板：把 ns.example.com 换成你的域名，并按你的方式签发证书（这里假设 certbot）。
# 应用只监听 127.0.0.1:8090，nginx 负责 HTTPS，并写入 X-Real-IP 供登录限速使用。
server {
    listen 80;
    listen [::]:80;
    server_name ns.example.com;

    location ^~ /.well-known/acme-challenge/ {
        root /var/www/ns-acme;
    }

    location / {
        return 301 https://$host$request_uri;
    }
}

server {
    listen 443 ssl;
    listen [::]:443 ssl;
    server_name ns.example.com;

    ssl_certificate /etc/letsencrypt/live/ns.example.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/ns.example.com/privkey.pem;
    include /etc/letsencrypt/options-ssl-nginx.conf;
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem;

    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header X-Permitted-Cross-Domain-Policies "none" always;

    access_log /var/log/nginx/ns-entertainment-access.log;
    error_log /var/log/nginx/ns-entertainment-error.log;

    location / {
        proxy_pass http://127.0.0.1:8090;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-Host $host;
        proxy_read_timeout 180s;
        proxy_send_timeout 180s;
        client_max_body_size 25m;
    }
}
