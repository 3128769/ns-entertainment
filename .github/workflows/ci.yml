name: ci

on:
  push:
  pull_request:

jobs:
  backend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: backend/requirements-dev.txt
      - run: pip install -r requirements-dev.txt
      - run: python -m pytest -q

  frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      - run: npm test
      - run: npm run build

  image:
    runs-on: ubuntu-latest
    needs: [backend, frontend]
    steps:
      - uses: actions/checkout@v7
      - run: docker build --target test -t ns-entertainment:test . && docker run --rm --network none ns-entertainment:test

  script:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - run: shellcheck install.sh
      - run: shellcheck -S warning tests/install/*.sh
      - name: README compose block matches docker-compose.template.yml
        run: |
          python3 - <<'PY'
          import re, sys
          readme = open("README.md", encoding="utf-8").read()
          template = open("docker-compose.template.yml", encoding="utf-8").read().rstrip("\n")
          block = re.search(r"```yaml\n(.*?)\n```", readme, re.S)
          sys.exit(0 if block and block.group(1) == template else "README.md 里的 compose 内容和 docker-compose.template.yml 不一致")
          PY

  install-e2e:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Build the image that docker-compose.template.yml points to
        run: |
          IMG="$(sed -n 's/^[[:space:]]*image:[[:space:]]*\([^[:space:]#]*\).*/\1/p' docker-compose.template.yml | head -n 1)"
          docker build --target runtime -t "$IMG" .
      - name: install.sh end to end (install, backup, update, failed update rolls back, rollback, uninstall)
        run: sudo -E bash tests/install/e2e.sh

  install-nginx:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: install.sh nginx / HTTPS flow (throwaway Debian container)
        run: docker run --rm -v "$PWD:/src:ro" python:3.12-slim bash /src/tests/install/nginx.sh
